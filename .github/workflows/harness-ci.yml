name: Harness CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate harness structure and routing
        run: python scripts/validate_harness.py
      - name: Test deterministic harness tools
        run: python -m unittest discover -s tests -p "test_*.py" -v
